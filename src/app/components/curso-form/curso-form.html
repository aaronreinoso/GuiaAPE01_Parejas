<h2>{{ idCurso ? 'Editar curso' : 'Nuevo curso' }}</h2>

<form [formGroup]="form" (ngSubmit)="guardar()">
	<label>
		Nombre
		<input type="text" formControlName="nombre" placeholder="Ej. Preparar exposición" />
	</label>

	<div class="acciones-form">
		<button type="submit" [disabled]="form.invalid">Guardar</button>
		<a routerLink="/cursos">Cancelar</a>
	</div>
</form>
